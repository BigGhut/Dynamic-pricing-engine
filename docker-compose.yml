services:
  redis:
    image: redis:7-alpine
    container_name: dpe-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dpe-api
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - USE_LOCAL_SIMULATED_REDIS=false
      - CAUSAL_ENABLED=false
      - SIM_MODE=true
      - DB_PATH=/data/dpe_database.db
    volumes:
      - dpe-data:/data
    depends_on:
      - redis
    restart: unless-stopped

  simulator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dpe-simulator
    command: ["python", "scripts/run_simulation.py"]
    environment:
      - API_URL=http://api:8000
      - DB_PATH=/data/dpe_database.db
    volumes:
      - dpe-data:/data
    depends_on:
      - api
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: dpe-dashboard
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
      - PUBLIC_API_URL=http://127.0.0.1:8000
      - DB_PATH=/data/dpe_database.db
    volumes:
      - dpe-data:/data
    depends_on:
      - api
    restart: unless-stopped

volumes:
  dpe-data:
