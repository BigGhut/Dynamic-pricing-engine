[tool.poetry]
name = "dynamic-pricing-engine"
version = "1.0.0"
description = "Dynamic Pricing Engine (DPE) with Additive Surge and Switchback A/B testing"
authors = ["BigGhut"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.100.0"
uvicorn = "^0.22.0"
streamlit = "^1.25.0"
pandas = "^2.0.0"
catboost = "^1.2"
h3 = ">=4.1.0,<5"
redis = "^4.6.0"
requests = "^2.31.0"
httpx = "^0.24.0"
numpy = "^1.24.0"
altair = "^5.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-mock = "^3.11.1"
ruff = "^0.0.280"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
select = ["E", "F", "B", "I"]
ignore = []

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
